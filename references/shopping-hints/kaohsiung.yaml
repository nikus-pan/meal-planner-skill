region: 高雄
markets:
- name: 鹽埕第一公有零售市場
  address: 高雄市鹽埕區瀨南街141之7號
  hours: 早市約07:00-12:00；週三至週日16:00-21:30（週一、週二休市；各來源時段略有出入，以市場管理處公告為準）
  note: 70多年歷史老市場，鹽埕在地菜市仔；捷運鹽埕埔站旁；2022年起優化改造，保留舊樣貌並加入質感設計，早市蔬菜、漁鮮與熟食，另有夜間市集。
- name: 三民第一公有零售市場（三民第一市場）
  address: 高雄市三民區中華三路285-39號
  hours: 約07:30-13:00（攤商各異；週一休市）
  note: 三民區傳統菜市仔，中華路一帶；蔬果蔬菜、豬肉、雞鴨與熟食攤齊全，業種區域明確、地板乾淨；假日有表演節目。
- name: 果貿公有市場（左營區果貿市場）
  address: 高雄市左營區中華一路9號
  hours: 約07:00-12:00（週一公休）
  note: 左營區果貿眷村一帶社區傳統市場；早市買菜為主，在地居民日常採買處；市場管理處列管公有零售市場。
