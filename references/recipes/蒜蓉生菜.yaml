meta:
  name: 蒜蓉生菜
  meal_slots: [lunch, dinner]
  cooking_time_min: 7
  strict_sensitive: [hypertension:H1]

ingredients:
  - { item: 生菜, qty: 2 大棵（約 300 g）, substitutable: true,
      alt: [青江、小白菜] }
  - { item: 蒜末, qty: 2 瓣, substitutable: true, alt: [略] }
  - { item: 醬油, qty: 1 小匙, substitutable: true, alt: [低鈉醬油],
      strict_sensitive: [hypertension:H1] }
  - { item: 鹽, qty: 少許, substitutable: true, alt: [略],
      strict_sensitive: [hypertension:H1] }
  - { item: 食用油, qty: 1 小匙, substitutable: false }

steps:
  - { stage: 備料, text: "生菜洗淨撕開、蒜切碎備用", time_min: 4 }
  - { stage: 烹調, text: "大火熱油、下蒜末爆香約 15 秒", time_min: 1 }
  - { stage: 完成, text: "下生菜大火快炒 1–2 分至半軟、加醬油鹽拌勻起鍋", time_min: 2 }

health_flags:
  - "醬油/鹽：高血壓 (H1) 低鈉版或減量"
  - "生菜 = 高纖蔬菜，高血壓 (H3) 蔬果攝取 advisory 對應"
