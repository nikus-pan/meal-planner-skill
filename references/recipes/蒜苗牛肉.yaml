meta:
  name: 蒜苗牛肉
  meal_slots: [lunch, dinner]
  cooking_time_min: 22
  strict_sensitive: [diabetes:T3]

ingredients:
  - { item: 牛肉, qty: 150 g, substitutable: true, alt: [羊肉],
      strict_sensitive: [diabetes:T3] }
  - { item: 蒜苗, qty: 3 支, substitutable: false }
  - { item: 蒜末, qty: 2 瓣, substitutable: false }
  - { item: 醬油, qty: 1 匙, substitutable: true, alt: [低鈉醬油],
      strict_sensitive: [hypertension:H1] }

steps:
  - { stage: 備料, text: "牛肉逆紋切片、加醬油+生粉+少許油醃10分", time_min: 10 }
  - { stage: 備料, text: "蒜苗切3cm段、蒜切末", time_min: 3 }
  - { stage: 烹調, text: "大火油爆蒜末", time_min: 2 }
  - { stage: 烹調, text: "牛肉快炒至變色先起鍋", time_min: 2 }
  - { stage: 烹調, text: "蒜苗同炒至軟", time_min: 2 }
  - { stage: 烹調, text: "牛肉回鍋、醬油調味翻勻", time_min: 3 }

health_flags:
  - "牛肉 advisory：糖尿病 (T3) 最小化紅肉 → 可換雞肉"
  - "醬油 strict_sensitive：高血壓 (H1) → 低鈉版或減量"
