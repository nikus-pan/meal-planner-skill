meta:
  name: 滷蛋
  meal_slots: [breakfast, lunch, dinner]
  cooking_time_min: 28
  strict_sensitive: [allergens:A6, hypertension:H1]

ingredients:
  - { item: 雞蛋, qty: 3 顆, substitutable: true, alt: [豆腐（滷）],
      strict_sensitive: [allergens:A6] }
  - { item: 醬油, qty: 2 匙, substitutable: true, alt: [低鈉醬油],
      strict_sensitive: [hypertension:H1] }
  - { item: 香料包（八角、月桂葉）, qty: 少許, substitutable: false }
  - { item: 水, qty: 1 杯, substitutable: false }

steps:
  - { stage: 烹調, text: "雞蛋冷水下鍋煮8分、過冷水剝殼", time_min: 8 }
  - { stage: 烹調, text: "醬油＋八角＋月桂葉＋1杯水滾轉小火燜5分", time_min: 5 }
  - { stage: 烹調, text: "蛋入湯大火滾轉小火滷10分", time_min: 10 }
  - { stage: 烹調, text: "可回鍋隔夜再滷一次更入味", time_min: 5 }

health_flags:
  - "雞蛋 strict_sensitive：蛋 (A6) → 蛋過敏剔除"
  - "醬油 strict_sensitive：高血壓 (H1) → 低鈉版或減量"
